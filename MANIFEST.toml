long_description = """Override metadata from MusicBrainz based on local config files.

The plugin reads a YAML config file to supply new values for tags. This allows updating a file from MusicBrainz without having to apply manual modifications each time.

Additionally, the plugin allows mapping genres and has a white and black list for adding release series to tags.

Sample configuration files can be found in [example](example). When using the plugin, please create own copies and select the respective path in the options.
"""
